        href: https://glances.local.wywiol.eu
        icon: glances
        description: System stats
        server: x000
        container: glances
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: cpu
    - Caddy:
        icon: caddy
        description: Reverse proxy
        server: x000
        container: caddy
    - Portainer:
        href: https://portainer.local.wywiol.eu
        icon: portainer
        description: Container management
        server: x000
        container: portainer
    - Pi-hole:
        href: https://pihole.local.wywiol.eu/admin/
        icon: pi-hole
        description: DNS & ad-blocking
        server: x000
        container: pihole
        widget:
          type: pihole
          url: http://pihole
          version: 6
